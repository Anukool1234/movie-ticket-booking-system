spring:
  application:
    name: movie-ticket-booking

  datasource:
    url: jdbc:h2:mem:movieticket;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# Custom app settings (kept simple and readable)
app:
  seat-hold:
    duration-minutes: 10      # seats held for 10 minutes before auto-release
  notification:
    reminder-minutes-before: 15 # send one reminder 15 minutes before the show

logging:
  level:
    com.movieticket: INFO
